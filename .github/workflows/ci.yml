name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=budget --cov-fail-under=100

      - name: Check cyclomatic complexity
        run: |
          radon cc budget tests -a -s -n B
          xenon budget tests --max-average B --max-absolute B --max-modules B

      - name: Run flake8
        run: |
          flake8 budget tests
